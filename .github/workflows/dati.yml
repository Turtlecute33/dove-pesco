name: Dati e pubblicazione

# Il sito è statico: l'unica cosa che invecchia sono le previsioni.
# Questo flusso le riscarica ogni due ore e ripubblica la pagina, così i
# visitatori leggono un file già pronto invece di chiamare Open-Meteo dal
# proprio browser: nessun limite di richieste da superare, prima schermata
# immediata, e nessun indirizzo IP di chi pesca mostrato a servizi terzi.
#
# Perché due ore: un giro costa circa 350 chiamate pesate sul conto gratuito
# di Open-Meteo (10.000 al giorno per indirizzo IP). Dodici giri al giorno
# stanno larghi; ogni ora sarebbero 8.400, troppo vicini al tetto.

on:
  push:
    branches: [main]
  schedule:
    - cron: '7 */2 * * *'      # ogni due ore, al minuto 7 (ora UTC)
  workflow_dispatch:            # e quando lo lanci a mano

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  costruisci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # genera-pagine.py legge gli elenchi in assets/js con node, cosi' i dati
      # degli spot stanno in un posto solo e non vanno ricopiati in Python
      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Configura Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Scarica meteo e portata
        id: dati
        continue-on-error: true
        run: python3 tools/aggiorna-dati.py

      - name: Se la rete ha detto no, tengo le previsioni già pubblicate
        if: steps.dati.outcome != 'success'
        run: |
          mkdir -p assets/dati
          curl -fsS -o assets/dati/previsioni.json \
            "${{ steps.pages.outputs.base_url }}/assets/dati/previsioni.json" \
            || echo "Nessun file precedente: il sito chiamerà Open-Meteo dal browser."

      - name: Prepara la cartella da pubblicare
        # genera-pagine.py copia l'applicazione, scrive le 277 pagine statiche
        # (222 spot, 40 specie, 9 province e le pagine fisse), la sitemap, il
        # robots.txt, la 404 e — se la variabile DOMINIO c'è — il file CNAME.
        # Dominio personalizzato: Settings → Secrets and variables → Actions →
        # Variables → New variable → DOMINIO.
        env:
          DOMINIO: ${{ vars.DOMINIO }}
        run: |
          python3 tools/genera-pagine.py --base "${DOMINIO:-${{ steps.pages.outputs.base_url }}}"
          du -sh _sito
          echo "pagine: $(find _sito -name index.html | wc -l)"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _sito
          include-hidden-files: true

  pubblica:
    needs: costruisci
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
