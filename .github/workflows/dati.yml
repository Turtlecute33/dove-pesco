name: Dati e pubblicazione

# Il sito è statico: l'unica cosa che invecchia sono le previsioni.
# Questo flusso le riscarica ogni due ore e ripubblica la pagina, così i
# visitatori leggono un file già pronto invece di chiamare Open-Meteo dal
# proprio browser: nessun limite di richieste da superare, prima schermata
# immediata, e nessun indirizzo IP di chi pesca mostrato a servizi terzi.
#
# Perché due ore: un giro costa circa 350 chiamate pesate sul conto gratuito
# di Open-Meteo (10.000 al giorno per indirizzo IP). Dodici giri al giorno
# stanno larghi; ogni ora sarebbero 8.400, troppo vicini al tetto.

on:
  push:
    branches: [main]
  schedule:
    - cron: '7 */2 * * *'      # ogni due ore, al minuto 7 (ora UTC)
  workflow_dispatch:            # e quando lo lanci a mano

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  costruisci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Configura Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Scarica meteo e portata
        id: dati
        continue-on-error: true
        run: python3 tools/aggiorna-dati.py

      - name: Se la rete ha detto no, tengo le previsioni già pubblicate
        if: steps.dati.outcome != 'success'
        run: |
          mkdir -p assets/dati
          curl -fsS -o assets/dati/previsioni.json \
            "${{ steps.pages.outputs.base_url }}/assets/dati/previsioni.json" \
            || echo "Nessun file precedente: il sito chiamerà Open-Meteo dal browser."

      - name: Prepara la cartella da pubblicare
        run: |
          mkdir -p _sito
          cp index.html _sito/
          cp -r assets _sito/
          touch _sito/.nojekyll
          du -sh _sito

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _sito
          include-hidden-files: true

  pubblica:
    needs: costruisci
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
