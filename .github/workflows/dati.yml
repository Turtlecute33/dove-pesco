name: Dati e pubblicazione

# Il sito è statico: l'unica cosa che invecchia sono le previsioni.
# Questo flusso le riscarica e ripubblica la pagina, così i visitatori leggono
# un file già pronto invece di chiamare Open-Meteo dal proprio browser: nessun
# limite di richieste da superare, prima schermata immediata, e nessun
# indirizzo IP di chi pesca mostrato a servizi terzi.
#
# Perché quattro ore. I dati sono giornalieri: fra un giro e il successivo i
# numeri sono gli stessi, cambia solo l'ora del rilevamento. Prima erano due
# ore, dodici giri al giorno; sei bastano, e ogni giro in meno è una
# connessione in meno che può incagliarsi verso Open-Meteo (vedi la nota in
# tools/aggiorna-dati.py). Il tetto di 5 ore oltre il quale il browser va in
# rete da solo sta in assets/js/api.js: se cambi il cron, cambia anche quello.

on:
  push:
    branches: [main]
  schedule:
    - cron: '7 */4 * * *'      # ogni quattro ore, al minuto 7 (ora UTC)
  workflow_dispatch:            # e quando lo lanci a mano

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  costruisci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # genera-pagine.py legge gli elenchi in assets/js con node, cosi' i dati
      # degli spot stanno in un posto solo e non vanno ricopiati in Python
      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Configura Pages
        id: pages
        uses: actions/configure-pages@v6

      # Due richieste, tetto di 25 secondi, tre ritentativi: in condizioni
      # normali dura cinque secondi, nel caso peggiore cinque minuti e mezzo.
      # Il limite di 7 minuti è la rete di sicurezza: se Open-Meteo non risponde
      # affatto, il passo viene interrotto, continue-on-error lascia proseguire e
      # il passo dopo riprende il file già pubblicato. Senza questo limite un
      # giro incagliato teneva occupato il gruppo "pages" per venti minuti e
      # ritardava le pubblicazioni.
      - name: Scarica meteo e portata
        id: dati
        continue-on-error: true
        timeout-minutes: 7
        run: python3 tools/aggiorna-dati.py

      - name: Se la rete ha detto no, tengo le previsioni già pubblicate
        if: steps.dati.outcome != 'success'
        run: |
          mkdir -p assets/dati
          curl -fsS -o assets/dati/previsioni.json \
            "${{ steps.pages.outputs.base_url }}/assets/dati/previsioni.json" \
            || echo "Nessun file precedente: il sito chiamerà Open-Meteo dal browser."

      - name: Prepara la cartella da pubblicare
        # genera-pagine.py copia l'applicazione, scrive le 277 pagine statiche
        # (222 spot, 40 specie, 9 province e le pagine fisse), la sitemap, il
        # robots.txt, la 404 e — se la variabile DOMINIO c'è — il file CNAME.
        # Dominio personalizzato: Settings → Secrets and variables → Actions →
        # Variables → New variable → DOMINIO.
        env:
          DOMINIO: ${{ vars.DOMINIO }}
        run: |
          python3 tools/genera-pagine.py --base "${DOMINIO:-${{ steps.pages.outputs.base_url }}}"
          du -sh _sito
          echo "pagine: $(find _sito -name index.html | wc -l)"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _sito
          include-hidden-files: true

  pubblica:
    needs: costruisci
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
